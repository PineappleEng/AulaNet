<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to AulaNet</title>
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="stylesheet" href="../styles/common.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- NAV -->

    <!-- Main Content -->
    <div class="main-container">
        <div class="login-card">
            <!-- Header -->
            <div class="header">
                <div class="icon-circle">
                    <i data-lucide="graduation-cap" class="header-icon"></i>
                </div>
                <h1>Sign in to AulaNet</h1>
                <p>Access your academic community</p>
            </div>

            <!-- Login Form -->
            <form class="form" id="loginForm" method="post" action="./login.php">
                <div class="form-group">
                    <label for="email">University Email</label>
                    <input type="email" id="email" name="email" placeholder="your.name@university.edu" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required />
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" />
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">New to AulaNet?</span>
            </div>

            <!-- Register Link -->
            <div class="register-section">
                <a href="./register.html" class="register-link">Create an account</a>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>

</html>
