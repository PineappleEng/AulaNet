<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join AulaNet</title>
  <link rel="stylesheet" href="../styles/register.css">
  <link rel="stylesheet" href="../styles/common.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <!-- NAV -->

  <!-- Main Content -->
  <div class="main-container">
    <div class="register-card">
      <!-- Header -->
      <div class="header">
        <div class="icon-circle">
          <i data-lucide="graduation-cap" class="header-icon"></i>
        </div>
        <h1>Join AulaNet</h1>
        <p>Create your account to start collaborating</p>
      </div>

      <!-- Register Form -->
      <form class="form" id="registerForm" method="post" action="./register.php">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Ana Silva" required />
        </div>

        <div class="form-group">
          <label for="email">University Email</label>
          <input type="email" id="email" name="email" placeholder="your.name@university.edu" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="major">Major</label>
            <select id="major" name="major" required>
              <option value="">Select...</option>
              <option value="cs">Computer Science</option>
              <option value="se">Software Engineering</option>
              <option value="is">Information Systems</option>
              <option value="it">Information Technology</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="year">Year</label>
            <select id="year" name="year" required>
              <option value="">Select...</option>
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3">3rd Year</option>
              <option value="4">4th Year</option>
              <option value="graduate">Graduate</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a strong password" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password"
            required />
        </div>

        <div class="terms-text">
          By creating an account, you agree to our Terms of Service and Privacy Policy.
        </div>

        <button type="submit" class="submit-btn">Create Account</button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">Already have an account?</span>
      </div>

      <!-- Login Link -->
      <div class="login-section">
        <a href="./login.html" class="login-link">Sign in instead</a>
      </div>
    </div>
  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();
  </script>
</body>

</html>
