<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - AulaNet</title>
    <link rel="stylesheet" href="../styles/profile.css">
    <link rel="stylesheet" href="../styles/common.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- NAV -->

    <!-- Main Container -->
    <div class="main-container">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-content">
                <!-- Avatar -->
                <div class="avatar-wrapper">
                    <div class="avatar">
                        <i data-lucide="user"></i>
                    </div>
                </div>

                <!-- User Info -->
                <div class="user-info">
                    <div class="user-header">
                        <div>
                            <h1 class="user-name"><!-- PROFILE_NAME --></h1>
                            <!-- Uncomment for admin users -->
                            <!-- <span class="admin-badge">
                <i data-lucide="award"></i>
                Administrator
              </span> -->
                        </div>
                    </div>

                    <div class="user-details">
                        <div class="detail-item">
                            <i data-lucide="mail"></i>
                            <span><!-- PROFILE_EMAIL --></span>
                        </div>
                        <div class="detail-item">
                            <i data-lucide="graduation-cap"></i>
                            <span><!-- PROFILE_ROLE --></span>
                        </div>
                        <div class="detail-item">
                            <i data-lucide="calendar"></i>
                            <span><!-- PROFILE_JOINED --></span>
                        </div>
                        <div class="detail-item">
                            <i data-lucide="award"></i>
                            <span><!-- PROFILE_ACTIVITY --></span>
                        </div>
                    </div>

                    <!-- Stats -->
                    <div class="stats-wrapper">
                        <div class="stat-card questions">
                            <div class="stat-value"><!-- PROFILE_QUESTIONS_COUNT --></div>
                            <div class="stat-label">Questions</div>
                        </div>
                        <div class="stat-card answers">
                            <div class="stat-value"><!-- PROFILE_ANSWERS_COUNT --></div>
                            <div class="stat-label">Answers</div>
                        </div>
                        <div class="stat-card reputation">
                            <div class="stat-value"><!-- PROFILE_VIEWS_COUNT --></div>
                            <div class="stat-label">Views</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Content Tabs -->
        <div class="content-tabs">
            <!-- Tab Headers -->
            <div class="tabs-header">
                <div class="tabs-nav">
                    <button class="tab-btn active" data-tab="questions">
                        <i data-lucide="help-circle"></i>
                        <span>Questions (<!-- PROFILE_QUESTIONS_COUNT -->)</span>
                    </button>
                    <button class="tab-btn" data-tab="answers">
                        <i data-lucide="message-square"></i>
                        <span>Answers (<!-- PROFILE_ANSWERS_COUNT -->)</span>
                    </button>
                </div>
            </div>

            <!-- Tab Content -->
            <div class="tab-content">
                <!-- Questions Tab -->
                <div id="questionsTab" class="tab-panel">
                    <div class="questions-list">
                        <!-- PROFILE_QUESTIONS -->
                    </div>
                </div>

                <!-- Answers Tab -->
                <div id="answersTab" class="tab-panel hidden">
                    <!-- PROFILE_ANSWERS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Tab switching functionality
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabPanels = document.querySelectorAll('.tab-panel');

        tabButtons.forEach(btn => {
            btn.addEventListener('click', function () {
                const tabName = this.dataset.tab;

                // Remove active class from all buttons
                tabButtons.forEach(b => b.classList.remove('active'));

                // Add active class to clicked button
                this.classList.add('active');

                // Hide all tab panels
                tabPanels.forEach(panel => panel.classList.add('hidden'));

                // Show selected tab panel
                const selectedPanel = document.getElementById(tabName + 'Tab');
                if (selectedPanel) {
                    selectedPanel.classList.remove('hidden');
                }
            });
        });
    </script>
    <!-- FOOTER -->
</body>

</html>
