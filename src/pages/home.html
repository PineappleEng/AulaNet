<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AulaNet - Home</title>
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../styles/common.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- NAV -->

    <!-- Main Container -->
    <div class="main-container">
        <div class="content-wrapper">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-card">
                    <h3>Filter by Subject</h3>
                    <ul class="subject-list" id="subjectList">
                        <li><button class="subject-btn active" data-subject="all">All Subjects</button></li>
                    </ul>

                    <div class="stats-section">
                        <h3>Community Stats</h3>
                        <div class="stats-list">
                            <div class="stat-item">
                                <span>Questions</span>
                                <span class="stat-value" id="questionStat">0</span>
                            </div>
                            <div class="stat-item">
                                <span>Answers</span>
                                <span class="stat-value" id="answerStat">0</span>
                            </div>
                            <div class="stat-item">
                                <span>Users</span>
                                <span class="stat-value" id="userStat">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Search Bar -->
                <div class="search-card">
                    <div class="search-wrapper">
                        <div class="search-input-wrapper">
                            <i data-lucide="search" class="search-icon"></i>
                            <input type="text" class="search-input" placeholder="Search questions..." />
                        </div>

                    </div>
                </div>

                <!-- Page Header -->
                <div class="page-header">
                    <div class="page-header-left">
                        <i data-lucide="trending-up"></i>
                        <h1>Recent Questions</h1>
                    </div>
                    <span class="question-count" id="questionCount">0 questions</span>
                </div>

                <!-- Questions List -->
                <div class="questions-list" id="questionsList"></div>

                <!-- Pagination -->
                <div class="pagination" id="questionPagination"></div>
            </main>
        </div>
    </div>

    <!-- DATA SCRIPT -->
    <script src="../scripts/home.js"></script>
    <!-- FOOTER -->
</body>

</html>
