<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AulaNet</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../styles/common.css">
    <link rel="stylesheet" href="../styles/admin.css">
</head>

<body>
    <!-- NAV -->

    <!-- Main Container -->
    <div class="main-container">
        <!-- Page Header -->
        <div class="page-header">
            <div class="header-title">
                <i data-lucide="shield"></i>
                <h1>Admin Dashboard</h1>
            </div>
            <p class="header-subtitle">Manage users and moderate content</p>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">Total Users</span>
                    <i data-lucide="users" class="stat-icon blue"></i>
                </div>
                <div class="stat-value"><!-- ADMIN_TOTAL_USERS --></div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">Pending Reports</span>
                    <i data-lucide="flag" class="stat-icon red"></i>
                </div>
                <div class="stat-value"><!-- ADMIN_PENDING_REPORTS --></div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">Active Students</span>
                    <i data-lucide="users" class="stat-icon green"></i>
                </div>
                <div class="stat-value"><!-- ADMIN_ACTIVE_STUDENTS --></div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">Blocked Users</span>
                    <i data-lucide="ban" class="stat-icon gray"></i>
                </div>
                <div class="stat-value"><!-- ADMIN_BLOCKED_USERS --></div>
            </div>
        </div>

        <!-- Main Content Card -->
        <div class="content-card">
            <!-- Tabs -->
            <div class="tabs-header">
                <div class="tabs-nav">
                    <button class="tab-btn active" data-tab="users">
                        <i data-lucide="users"></i>
                        <span>User Management</span>
                    </button>
                    <button class="tab-btn" data-tab="reports">
                        <i data-lucide="flag"></i>
                        <span>Content Moderation</span>
                        <span class="tab-badge"><!-- ADMIN_PENDING_REPORTS --></span>
                    </button>
                </div>
            </div>

            <!-- Tab Content -->
            <div class="tab-content">
                <!-- Users Tab -->
                <div id="usersTab" class="tab-panel">
                    <div class="search-wrapper">
                        <i data-lucide="search" class="search-icon"></i>
                        <input type="text" class="search-input" placeholder="Search users by name or email..."
                            id="userSearch" />
                    </div>

                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Questions</th>
                                    <th>Status</th>
                                    <th class="text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <!-- ADMIN_USERS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Reports Tab -->
                <div id="reportsTab" class="tab-panel hidden">
                    <div class="reports-list">
                        <!-- ADMIN_REPORTS -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- FOOTER -->

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Tab switching
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabPanels = document.querySelectorAll('.tab-panel');
        const activeTabName = new URLSearchParams(window.location.search).get('tab') === 'reports' ? 'reports' : 'users';

        function setActiveTab(tabName) {
            tabButtons.forEach((b) => b.classList.toggle('active', b.dataset.tab === tabName));
            tabPanels.forEach((panel) => panel.classList.add('hidden'));

            const selectedPanel = document.getElementById(tabName + 'Tab');
            if (selectedPanel) {
                selectedPanel.classList.remove('hidden');
            }
        }

        setActiveTab(activeTabName);

        tabButtons.forEach(btn => {
            btn.addEventListener('click', function () {
                setActiveTab(this.dataset.tab);

                const url = new URL(window.location.href);
                url.searchParams.set('tab', this.dataset.tab || 'users');
                window.history.replaceState({}, '', url.toString());
            });
        });

        // User search functionality
        const searchInput = document.getElementById('userSearch');
        const tableBody = document.getElementById('usersTableBody');
        const allRows = Array.from(tableBody.querySelectorAll('tr'));

        searchInput.addEventListener('input', function () {
            const query = this.value.toLowerCase();

            allRows.forEach(row => {
                const name = row.querySelector('.user-name').textContent.toLowerCase();
                const email = row.querySelector('.user-email').textContent.toLowerCase();

                if (name.includes(query) || email.includes(query)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });

    </script>
</body>

</html>
